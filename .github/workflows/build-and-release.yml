# tomgidden/minecraft-common: shared build-and-release pipeline for Minecraft mods.
#
# Called by each mod repo's own .github/workflows/build-and-release.yml, which
# is a thin stub -- see README.md for the stub to copy.
#
# Values that differ between mods come from the calling repo's
# gradle.properties, which is already the source of truth for the build:
#
#   mod_id              -- registry id; also the jar basename
#   mod_name            -- display name, e.g. "Trade School"
#   archives_base_name  -- OPTIONAL override for the jar basename
#   minecraft_publish_for_versions
#                       -- comma-separated Minecraft versions, e.g.
#                          26.1.2,26.2,26.3. REQUIRED when publishing:
#                          The build fails if it disagrees with
#                          minecraft_version / minecraft_version_min.
#
# Tagging triggers this workflow, but the format of the tag determines the
# type of release and where it is released.
#
#   tag                 kind               on tag push       on dispatch
#   ------------------  -----------------  ----------------  --------------
#   26.0.3              release            GitHub + MR + CF  per tick boxes
#   26.0.3+foo          release            GitHub only       per tick boxes
#   26.0.3-beta1        beta, prerelease   GitHub only       per tick boxes
#   26.0.3-alpha1       alpha, prerelease  GitHub only       per tick boxes
#   [arbitrary string]  not a version      build only        build + GitHub
#
# 26.0.3+foo is an exceptional post-release patch, like a hotfix or minor tweak.
# published by hand after deleting the base release as we can't be sure of the
# treatment of `+` by Modrinth and CurseForge.

name: Build and Release
on:
  workflow_call:
    inputs:
      publish_to_github:
        description: 'Publish to GitHub'
        type: boolean
        default: true
      publish_to_modrinth:
        description: 'Also publish to Modrinth (manual runs only)'
        type: boolean
        default: false
      publish_to_curseforge:
        description: 'Also publish to CurseForge (manual runs only)'
        type: boolean
        default: false
      java_version:
        description: 'JDK to build with'
        type: string
        default: '25'
      from_release:
        description: 'Publish the jars already attached to this run''s tag, instead of rebuilding'
        type: boolean
        default: false
      common_ref:
        description: 'Ref of minecraft-common to take the Gradle conventions from; match the stub''s `uses:` pin'
        type: string
        default: 'v1'
      modrinth_id:
        description: "Modrinth project id (caller's vars.MODRINTH_ID, or secret)"
        type: string
        default: ''
      curseforge_id:
        description: "CurseForge project id (caller's vars.CURSEFORGE_ID, or secret)"
        type: string
        default: ''
    secrets:
      MODRINTH_TOKEN:
        description: 'Modrinth API token (caller''s secrets.MODRINTH_TOKEN, or secret)'
        required: false
      CURSEFORGE_TOKEN:
        description: 'CurseForge API token (caller''s secrets.CURSEFORGE_TOKEN, or secret)'
        required: false
      MODRINTH_ID:
        description: "Modrinth project id if not set as var"
        required: false
      CURSEFORGE_ID:
        description: "CurseForge project id if not set as var"
        required: false

jobs:
  select:
    name: Select release type
    runs-on: ubuntu-latest
    outputs:
      publish_to_github: ${{ steps.g.outputs.publish_to_github }}
      publish_to_modrinth: ${{ steps.g.outputs.publish_to_modrinth }}
      publish_to_curseforge: ${{ steps.g.outputs.publish_to_curseforge }}
      prerelease: ${{ steps.g.outputs.prerelease }}
      version_type: ${{ steps.g.outputs.version_type }}
      is_version: ${{ steps.g.outputs.is_version }}
    steps:
      - id: g
        env:
          TAG: ${{ github.ref_name }}   # Calling mod's ref, not minecraft-common's
          IS_TAG: ${{ github.ref_type == 'tag' }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          WANT_GITHUB: ${{ inputs.publish_to_github }}
          WANT_MODRINTH: ${{ inputs.publish_to_modrinth }}
          WANT_CURSEFORGE: ${{ inputs.publish_to_curseforge }}
        run: |
          publish_to_github=false
          publish_to_modrinth=false
          publish_to_curseforge=false
          prerelease=false
          version_type=""
          is_version=false
          auto_release=false

          if [ "$IS_TAG" = "true" ]; then
            if printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              is_version=true
              auto_release=true
              version_type=release
            elif printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?\+[A-Za-z0-9_.-]+$'; then
              is_version=true
              auto_release=false
              version_type=release
            elif printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?-[A-Za-z0-9_.]+$'; then
              is_version=true
              prerelease=true
              version_type=alpha
              case "$TAG" in
                *-[Bb]eta*|*-[Rr][Cc]*|*-[Pp]re*)
                  version_type=beta
                  ;;
              esac
            fi
          fi

          if [ "$IS_DISPATCH" = "true" ]; then
            [ "$WANT_GITHUB" = "true" ]     && publish_to_github=true
            [ "$WANT_MODRINTH" = "true" ]   && publish_to_modrinth=true
            [ "$WANT_CURSEFORGE" = "true" ] && publish_to_curseforge=true
            [ "$is_version" = "true" ]      || prerelease=true
          elif [ "$is_version" = "true" ]; then
            publish_to_github=true
            if [ "$auto" = "true" ]; then
              publish_to_modrinth=true
              publish_to_curseforge=true
            fi
          fi

          {
            echo "publish_to_github=$publish_to_github"
            echo "publish_to_modrinth=$publish_to_modrinth"
            echo "publish_to_curseforge=$publish_to_curseforge"
            echo "prerelease=$prerelease"
            echo "version_type=$version_type"
            echo "is_version=$is_version"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::tag='${TAG}' -> publish_to_github=$publish_to_github publish_to_modrinth=$publish_to_modrinth publish_to_curseforge=$publish_to_curseforge prerelease=$prerelease version_type=${version_type:-<unset>}"

  params:
    name: Read release parameters from gradle.properties
    needs: select
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      loaders: ${{ steps.m.outputs.loaders }}
      mod_name: ${{ steps.m.outputs.mod_name }}
      artifact: ${{ steps.m.outputs.artifact }}
      publish_for_versions: ${{ steps.m.outputs.publish_for_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read release config
        id: m
        env:
          TAG_IS_VERSION: ${{ needs.select.outputs.is_version }}
        run: |
          if [ ! -f gradle.properties ]; then
            echo "::error::gradle.properties not found in the calling repo."
            exit 1
          fi

          # Read one clean prop from `gradle.properties`
          gradle_prop() {
            sed -n "s/^$1=//p" gradle.properties | head -1 | sed 's/[[:space:]]*$//';
          }

          # Jar basename: mod_id unless archives_base_name overrides it.
          mod_name=$(gradle_prop mod_name)
          mod_id=$(gradle_prop mod_id)

          # Override mod_id with archives_base_name if set
          artifact=$(gradle_prop archives_base_name)
          [ -n "$artifact" ] || artifact="$mod_id"
          if [ -z "$mod_name" ] || [ -z "$mod_id" ]; then
            echo "::error::gradle.properties must define mod_id and mod_name."
            exit 1
          fi

          # VERSION comes from the tag, iff the tag is actually a version.
          if [ "$TAG_IS_VERSION" = "true" ]; then
            version="${{ github.ref_name }}"
          else
            version=$(gradle_prop mod_version)
          fi

          # Detect loaders for this repo
          loaders="[]"
          for loader in fabric neoforge; do
            [ -d "$loader" ] && loaders=$(echo "$loaders" | jq -c ". + [\"$loader\"]")
          done
          if [ "$loaders" = "[]" ]; then
            echo "::error::No fabric/ or neoforge/ subproject found."
            exit 1
          fi

          publish_for_versions=$(gradle_prop minecraft_publish_for_versions)

          {
            echo "version=$version"
            echo "loaders=$loaders"
            echo "mod_name=$mod_name"
            echo "artifact=$artifact"
            echo "publish_for_versions=$publish_for_versions"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::version=$version loaders=$loaders artifact=$artifact"

  build:
    name: Build and test
    needs: [select, params]
    if: ${{ !inputs.from_release }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-out.outputs.version }}
      loaders: ${{ steps.loaders-out.outputs.loaders }}
      mod_name: ${{ steps.cfg.outputs.mod_name }}
      artifact: ${{ steps.cfg.outputs.artifact }}
      publish_for_versions: ${{ steps.cfg.outputs.publish_for_versions }}
    steps:
      - name: Checkout calling mod repo
        uses: actions/checkout@v6

      - name: Checkout minecraft-common repo
        uses: actions/checkout@v6
        with:
          repository: tomgidden/minecraft-common
          ref: ${{ inputs.common_ref }} # Caller's ref, not minecraft-common's; eg. `v1`
          path: .minecraft-common

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache NeoForge/Loom toolchains (expensive to rebuild)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/neoformruntime
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: toolchains-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            toolchains-${{ runner.os }}-

      - name: Load release config
        id: cfg
        env:
          # VERSION only comes from the tag if the tag is actually a version
          # ie. a semver, not an arbitrary tag like "ci-foobar-123"
          TAG_IS_VERSION: ${{ needs.select.outputs.is_version }}
        run: |
          if [ ! -f gradle.properties ]; then
            echo "::error::gradle.properties not found in the calling repo."
            exit 1
          fi

          # Read one clean prop from `gradle.properties`
          gradle_prop() {
            sed -n "s/^$1=//p" gradle.properties | head -1 | sed 's/[[:space:]]*$//';
          }

          mod_name=$(gradle_prop mod_name)
          mod_id=$(gradle_prop mod_id)

          # Override mod_id with archives_base_name if set
          artifact=$(gradle_prop archives_base_name)
          [ -n "$artifact" ] || artifact="$mod_id"
          if [ -z "$mod_name" ] || [ -z "$mod_id" ]; then
            echo "::error::gradle.properties must define mod_id and mod_name."
            exit 1
          fi

          {
            echo "MOD_NAME=$mod_name"
            echo "ARTIFACT=$artifact"
          } >> "$GITHUB_ENV"

          publish_for_versions=$(gradle_prop minecraft_publish_for_versions)

          {
            echo "mod_name=$mod_name"
            echo "artifact=$artifact"
            echo "publish_for_versions=$publish_for_versions"
          } >> "$GITHUB_OUTPUT"

          if [ "$TAG_IS_VERSION" = "true" ]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(gradle_prop mod_version)" >> "$GITHUB_ENV"
          fi

          targets=""
          for loader in fabric neoforge; do
            if [ -d "$loader" ]; then
              targets="$targets :$loader:build"
              echo "HAS_$(echo "$loader" | tr '[:lower:]' '[:upper:]')=true" >> "$GITHUB_ENV"
            fi
          done
          if [ -z "$targets" ]; then
            echo "::error::No fabric/ or neoforge/ subproject found -- nothing to build."
            exit 1
          fi

          echo "GRADLE_TARGETS=${targets# }" >> "$GITHUB_ENV"

      - name: Check version against tag
        if: ${{
          github.ref_type == 'tag' &&
          needs.select.outputs.github == 'true'
          }}
        # -Pmod_version overrides gradle.properties. Detect drift and warn...
        run: |
          in_file=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$in_file" != "$VERSION" ]; then
            echo "::warning::gradle.properties has mod_version=$in_file but the tag is $VERSION; building as $VERSION."
          fi

      - name: Build
        run: ./gradlew $GRADLE_TARGETS -Pmod_version="$VERSION"

      - name: Set version output
        id: version-out
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect release files
        run: |
          mkdir -p "$RUNNER_TEMP/release-files"
          for loader in fabric neoforge; do
            jar="$loader/build/libs/${ARTIFACT}-${loader}-${VERSION}.jar"
            [ -f "$jar" ] && cp "$jar" "$RUNNER_TEMP/release-files/"
          done

      - name: Upload release files
        uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Set loaders output
        id: loaders-out
        run: |
          loaders="[]"
          for loader in fabric neoforge; do
            jar="$loader/build/libs/${ARTIFACT}-${loader}-${VERSION}.jar"
            [ -f "$jar" ] && loaders=$(echo "$loaders" | jq -c ". + [\"$loader\"]")
          done
          echo "loaders=$loaders" >> "$GITHUB_OUTPUT"

  release-github:
    name: Publish to GitHub Releases (release and prerelease tags and manual dispatches)
    needs: [select, params, build]

    # `always()` so a skipped build (publishing from an existing release) doesn't skip this too
    if: ${{
      always() &&
      needs.select.outputs.publish_to_github == 'true' &&
      !inputs.from_release &&
      needs.build.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.params.outputs.version }}
      MOD_NAME: ${{ needs.params.outputs.mod_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release files
        uses: actions/download-artifact@v6
        with:
          name: release-files
          path: release-files

      - name: Render release body
        run: envsubst '${VERSION}' < .github/release/RELEASE.md > "$RUNNER_TEMP/release-body.md"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.MOD_NAME }} ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release-body.md
          files: release-files/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ needs.select.outputs.prerelease == 'true' }}

  release-modrinth:
    name: Publish to Modrinth (release tags and manual dispatches)
    needs: [select, params, build]
    # `always()` so a skipped build (publishing from an existing release) doesn't skip this too
    if: ${{
      always() &&
      needs.select.outputs.publish_to_modrinth == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: ${{ fromJson(needs.params.outputs.loaders) }}
    env:
      VERSION: ${{ needs.params.outputs.version }}
      MOD_NAME: ${{ needs.params.outputs.mod_name }}
      ARTIFACT: ${{ needs.params.outputs.artifact }}
      VERSION_TYPE: ${{ needs.select.outputs.version_type }}
      MINECRAFT_VERSIONS: ${{ needs.params.outputs.publish_for_versions }}
      MODRINTH_ID: ${{ inputs.modrinth_id || secrets.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release files from build artifacts
        if: ${{ !inputs.from_release }}
        uses: actions/download-artifact@v6
        with:
          name: release-files
          path: release-files

      - name: Download release files from GitHub Releases
        if: ${{ inputs.from_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh release download "$VERSION" --dir release-files --pattern '*.jar'
          echo "::notice::reusing $(ls release-files | wc -l | tr -d ' ') jar(s) from release $VERSION"

      - name: Expand game versions (comma-separated list)
        run: |
          if [ -z "$MINECRAFT_VERSIONS" ]; then
            echo "::error::minecraft_publish_for_versions is not set in gradle.properties. The jar's own metadata declares an open-ended range (e.g. minecraft \">=26.3 <27\"), which mc-publish would expand against its version list -- so this build could claim support for Minecraft versions released after it was built. Set e.g. minecraft_publish_for_versions=26.3"
            exit 1
          fi

          {
            echo "MINECRAFT_VERSIONS_LIST<<EOF"
            printf '%s' "$MINECRAFT_VERSIONS" | tr ',' '\n'
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Render changelog
        run: envsubst '${VERSION}' < .github/release/CHANGELOG.md > "$RUNNER_TEMP/changelog.md"

      - name: Check Modrinth config
        if: ${{
          env.MODRINTH_TOKEN != '' &&
          env.MODRINTH_ID == ''
          }}
        run: |
          echo "::error::MODRINTH_TOKEN is set but no Modrinth project id was found -- nothing would be published. Set vars.MODRINTH_ID (or secrets.MODRINTH_ID) on the calling repo."
          exit 1

      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: release-files/${{ env.ARTIFACT }}-${{ matrix.loader }}-${{ env.VERSION }}.jar
          name: ${{ env.MOD_NAME }} ${{ env.VERSION }} (${{ matrix.loader }})
          version: ${{ env.VERSION }}-${{ matrix.loader }}
          version-type: ${{ env.VERSION_TYPE }}
          game-versions: ${{ env.MINECRAFT_VERSIONS_LIST }}
          changelog-file: ${{ runner.temp }}/changelog.md

  release-curseforge:
    name: Publish to CurseForge (release tags and manual dispatches)
    needs: [select, params, build]
    # `always()` so a skipped build (publishing from an existing release) doesn't skip this too
    if: ${{
      always() &&
      needs.select.outputs.publish_to_curseforge == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: ${{ fromJson(needs.params.outputs.loaders) }}
    env:
      VERSION: ${{ needs.params.outputs.version }}
      MOD_NAME: ${{ needs.params.outputs.mod_name }}
      ARTIFACT: ${{ needs.params.outputs.artifact }}
      VERSION_TYPE: ${{ needs.select.outputs.version_type }}
      MINECRAFT_VERSIONS: ${{ needs.params.outputs.publish_for_versions }}
      CURSEFORGE_ID: ${{ inputs.curseforge_id || secrets.CURSEFORGE_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release files from build artifacts
        if: ${{ !inputs.from_release }}
        uses: actions/download-artifact@v6
        with:
          name: release-files
          path: release-files

      - name: Download release files from GitHub Releases
        if: ${{ inputs.from_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh release download "$VERSION" --dir release-files --pattern '*.jar'
          echo "::notice::reusing $(ls release-files | wc -l | tr -d ' ') jar(s) from release $VERSION"

      - name: Expand game versions (comma-separated list)
        run: |
          if [ -z "$MINECRAFT_VERSIONS" ]; then
            echo "::error::minecraft_publish_for_versions is not set in gradle.properties. The jar's own metadata declares an open-ended range (e.g. minecraft \">=26.3 <27\"), which mc-publish would expand against its version list -- so this build could claim support for Minecraft versions released after it was built. Set e.g. minecraft_publish_for_versions=26.3"
            exit 1
          fi

          {
            echo "MINECRAFT_VERSIONS_LIST<<EOF"
            printf '%s' "$MINECRAFT_VERSIONS" | tr ',' '\n'
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Render changelog
        run: envsubst '${VERSION}' < .github/release/CHANGELOG.md > "$RUNNER_TEMP/changelog.md"

      - name: Check CurseForge config
        if: ${{ env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_ID == '' }}
        run: |
          echo "::error::CURSEFORGE_TOKEN is set but no CurseForge project id was found -- nothing would be published. Set vars.CURSEFORGE_ID (or secrets.CURSEFORGE_ID) on the calling repo."
          exit 1

      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' }}
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: release-files/${{ env.ARTIFACT }}-${{ matrix.loader }}-${{ env.VERSION }}.jar
          name: ${{ env.MOD_NAME }} ${{ env.VERSION }} (${{ matrix.loader }})
          version: ${{ env.VERSION }}-${{ matrix.loader }}
          version-type: ${{ env.VERSION_TYPE }}
          game-versions: ${{ env.MINECRAFT_VERSIONS_LIST }}
          changelog-file: ${{ runner.temp }}/changelog.md
