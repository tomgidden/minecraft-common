# Shared build-and-release pipeline for tomgidden's Minecraft mods.
#
# Called by each mod repo's own .github/workflows/build-and-release.yml, which
# is a thin stub -- see README.md for the stub to copy.
#
# Values that differ between mods come from the calling repo's
# gradle.properties, which is already the source of truth for the build:
#
#   mod_name            -- display name, e.g. "Trade School"
#   archives_base_name  -- jar basename; the jars are globbed by it, so
#                          reading the property Gradle itself names jars
#                          from removes a whole class of silent mismatch.
#                          NOT mod_id, which is the registry id and may
#                          differ (beaconobscura vs beacon-obscura).
#   game_versions       -- comma-separated Minecraft versions, e.g.
#                          26.1.2,26.2,26.3. REQUIRED when publishing:
#                          inferring from the jar's open-ended range would
#                          let a build claim versions released after it.
#                          Passed to both Modrinth and CurseForge.
#
# The release channel is NOT configured: it is derived from the tag (see the
# gate job), so it cannot drift from what is actually being released.
#
# Prose lives in the calling repo's .github/release/:
#
#   RELEASE.md    -- body of the GitHub release
#   CHANGELOG.md  -- changelog sent to Modrinth and CurseForge
#
# ...or is discovered from the repo layout itself: which loaders get built is
# decided by which of the fabric/ and neoforge/ subprojects are present, so a
# Fabric-only mod and a Fabric+NeoForge mod call this unchanged.
#
# Build and release are separate jobs. release-github/-modrinth/-curseforge
# each depend only on build's jars (via upload/download-artifact), not on each
# other, so if e.g. Modrinth publishing fails, use GitHub's "Re-run failed
# jobs" to retry just that job -- the build isn't repeated. (Re-running an old
# run replays that run's workflow files, not the current ones, so a fix here
# needs a new run to take effect.)
#
# Every tag builds. Two separate questions then decide the outcome: the tag's
# shape says what KIND of release it is, and the trigger says WHETHER it
# publishes. A bare version is the only thing that ever publishes by itself.
#
#                     kind                on tag push        on dispatch
#   26.0.3            release             GitHub + MR + CF   per tick boxes
#   26.0.3+foo        release             GitHub only        per tick boxes
#   26.0.3-beta1      beta, prerelease    GitHub only        per tick boxes
#   26.0.3-alpha1     alpha, prerelease   GitHub only        per tick boxes
#   workflow-update-* not a version       build only         build + GitHub
#
# 26.0.3+foo is an exceptional post-release patch -- a release-bug fix or a
# very minor tweak -- published by hand after deleting the base release, so it
# is a real release rather than a prerelease. It never goes out automatically:
# pushing the tag only builds and makes a GitHub release, and reaching the mod
# sites takes a manual dispatch with the boxes ticked.
#
# A dispatch from a branch has no tag to be judged by, so it stays a
# prerelease and takes its channel from mc-publish's default: an untagged run,
# or a tag that isn't a version number, is safe as a test build.

name: Build and Release (shared)

on:
  workflow_call:
    inputs:
      modrinth:
        description: 'Also publish to Modrinth (manual runs only)'
        type: boolean
        default: false
      curseforge:
        description: 'Also publish to CurseForge (manual runs only)'
        type: boolean
        default: false
      java-version:
        description: 'JDK to build with'
        type: string
        default: '25'
      # The project ids aren't secret, and are normally repo `vars`. A called
      # workflow can't see the caller's `vars` at all, so the stub passes them
      # in explicitly. A repo that holds its ids as secrets instead leaves
      # these empty, and the release jobs fall back to secrets.*_ID -- the
      # fallback has to happen HERE rather than in the stub, because the
      # `secrets` context is not available in a caller's `with:` block (only
      # github, needs, strategy, matrix, inputs and vars are).
      modrinth_id:
        description: "Modrinth project id (caller's vars.MODRINTH_ID, or secret)"
        type: string
        default: ''
      curseforge_id:
        description: "CurseForge project id (caller's vars.CURSEFORGE_ID, or secret)"
        type: string
        default: ''
    secrets:
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false
      # Only used as a fallback when the caller has no vars.*_ID to pass as an
      # input; declared so `secrets: inherit` can supply them.
      MODRINTH_ID:
        required: false
      CURSEFORGE_ID:
        required: false

jobs:
  # Decides what this run is allowed to publish, so the release jobs can stay
  # simple `if:` checks. GitHub's `on.push.tags` filter takes globs, not
  # regexes, and expressions have no regex operator either, so the version
  # shape is matched here in bash instead -- and every tag is built, whatever
  # it's called.
  #
  # See the table at the top of this file for what each tag shape produces.
  # In short: only a bare X.Y.Z auto-publishes; +build and -suffix tags make a
  # GitHub release and wait for a manual dispatch to go further; anything else
  # just builds.
  #
  # A manual dispatch decides only WHETHER a run publishes, never what kind of
  # release it is -- the tag still supplies that, so a run launched from a tag
  # is labelled the same either way, and the jars are still named after it
  # (see the VERSION logic in build). A dispatch from a ref that is not a
  # version tag has nothing to go on and stays a prerelease, so a test build
  # never looks like a real one.
  #
  # github.ref_type/ref_name refer to the CALLER's ref, so tags work here
  # exactly as they did when this lived in the mod repo.
  gate:
    runs-on: ubuntu-latest
    outputs:
      github: ${{ steps.g.outputs.github }}
      modrinth: ${{ steps.g.outputs.modrinth }}
      curseforge: ${{ steps.g.outputs.curseforge }}
      prerelease: ${{ steps.g.outputs.prerelease }}
      version_type: ${{ steps.g.outputs.version_type }}
      is_version: ${{ steps.g.outputs.is_version }}
    steps:
      - id: g
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          TAG: ${{ github.ref_name }}
          WANT_MODRINTH: ${{ inputs.modrinth }}
          WANT_CURSEFORGE: ${{ inputs.curseforge }}
        run: |
          gh=false; mr=false; cf=false; pre=false

          # The tag's shape decides what KIND of release this is -- how it is
          # labelled and whether it counts as a prerelease -- independently of
          # WHETHER it publishes, which is decided below. A manual dispatch
          # changes only the latter, so a run launched from a tag is labelled
          # by that tag whichever way it was triggered.
          #
          #   26.0.3        release  the only shape that auto-publishes
          #   26.0.3+foo    release  an exceptional post-release patch; the
          #                          base release is deleted by hand first, so
          #                          this is a real release, not a prerelease.
          #                          Never automatic -- dispatch + tick boxes.
          #   26.0.3-beta1  beta     prerelease
          #   (other)       --       not a version tag: build only
          #
          # Modrinth and CurseForge accept only release/beta/alpha, so a "-"
          # suffix is mapped onto those; an unrecognised one gets alpha, since
          # understating maturity is the harmless direction to fail.
          #
          # vt is empty for a non-tag run (a dispatch from a branch), and
          # then mc-publish falls back to its own default channel.
          vt=""; is_version=false; auto=false
          if [ "$IS_TAG" = "true" ]; then
            if printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              is_version=true; auto=true; vt=release
            elif printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?\+[A-Za-z0-9_.-]+$'; then
              is_version=true; vt=release          # manual-only patch release
            elif printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?-[A-Za-z0-9_.]+$'; then
              is_version=true; pre=true
              case "$TAG" in
                *-[Bb]eta*|*-[Rr][Cc]*|*-[Pp]re*) vt=beta ;;
                *)                                vt=alpha ;;
              esac
            fi
          fi

          # Dispatch is judged on the EVENT, not the ref: a manual run can be
          # launched from a tag as well as a branch, and when it is, ref_type
          # is 'tag'. Testing the ref here instead sent such a run down the tag
          # path, where the tick boxes were never read at all.
          if [ "$IS_DISPATCH" = "true" ]; then
            gh=true
            [ "$WANT_MODRINTH" = "true" ] && mr=true
            [ "$WANT_CURSEFORGE" = "true" ] && cf=true
            # A dispatch from a non-version ref has no tag to be judged by, so
            # it stays a prerelease: a test build never looks like a real one.
            [ "$is_version" = "true" ] || pre=true
          elif [ "$is_version" = "true" ]; then
            gh=true
            if [ "$auto" = "true" ]; then
              mr=true; cf=true                     # bare X.Y.Z only
            fi
          fi

          {
            echo "github=$gh"
            echo "modrinth=$mr"
            echo "curseforge=$cf"
            echo "prerelease=$pre"
            echo "version_type=$vt"
            echo "is_version=$is_version"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::tag='${TAG}' -> github=$gh modrinth=$mr curseforge=$cf prerelease=$pre version_type=${vt:-<unset>}"

  build:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-out.outputs.version }}
      loaders: ${{ steps.loaders-out.outputs.loaders }}
      # Read from gradle.properties once, here, so the release jobs never
      # parse it themselves.
      mod_name: ${{ steps.cfg.outputs.mod_name }}
      artifact: ${{ steps.cfg.outputs.artifact }}
      game_versions: ${{ steps.cfg.outputs.game_versions }}
    steps:
      # Checks out the CALLING mod repo at the ref that triggered the run --
      # which is what actions/checkout does by default from a called workflow.
      # (This workflow's own repo is never checked out; only its YAML is used.)
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # NeoForge's NFRT toolchain (downloaded/decompiled/patched Minecraft) and
      # Loom's own cache are expensive to rebuild but only change when the
      # pinned MC/loader/NeoForge versions do -- not on every source change --
      # so they're cached separately from setup-gradle's build-cache, keyed on
      # gradle.properties rather than the whole repo. The neoformruntime path
      # is simply unused in repos with no neoforge/ subproject.
      - name: Cache NeoForge/Loom toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/neoformruntime
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: toolchains-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            toolchains-${{ runner.os }}-

      # VERSION comes from the tag, but only when the tag is actually a version.
      # A tag like workflow-update-26.0.2 is a marker, not a version, and naming
      # jars after it would produce <artifact>-fabric-workflow-update-26.0.2.jar;
      # those runs fall back to mod_version from gradle.properties, as a manual
      # dispatch from a branch does.
      #
      # The set of loaders is derived from the repo layout: a loader is built
      # only if its subproject directory exists. GRADLE_TARGETS is the list of
      # build tasks; HAS_FABRIC/HAS_NEOFORGE gate the later per-loader steps.
      - name: Load release config
        id: cfg
        env:
          TAG_IS_VERSION: ${{ needs.gate.outputs.is_version }}
        run: |
          if [ ! -f gradle.properties ]; then
            echo "::error::gradle.properties not found in the calling repo."
            exit 1
          fi

          # Read one property, trimming the trailing whitespace a hand-edited
          # .properties file often carries. Deliberately NOT `source`: values
          # like `mod_name=Trade School` would otherwise run as a command.
          prop() { sed -n "s/^$1=//p" gradle.properties | head -1 | sed 's/[[:space:]]*$//'; }

          mod_name=$(prop mod_name)
          artifact=$(prop archives_base_name)
          if [ -z "$mod_name" ] || [ -z "$artifact" ]; then
            echo "::error::gradle.properties must define mod_name and archives_base_name."
            exit 1
          fi
          {
            echo "MOD_NAME=$mod_name"
            echo "ARTIFACT=$artifact"
          } >> "$GITHUB_ENV"

          # Checked in the publish jobs rather than here, so a build-only run
          # (a non-version tag) still succeeds without it.
          {
            echo "mod_name=$mod_name"
            echo "artifact=$artifact"
            echo "game_versions=$(prop game_versions)"
          } >> "$GITHUB_OUTPUT"

          if [ "$TAG_IS_VERSION" = "true" ]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(prop mod_version)" >> "$GITHUB_ENV"
          fi

          targets=""
          for loader in fabric neoforge; do
            if [ -d "$loader" ]; then
              targets="$targets :$loader:build"
              echo "HAS_$(echo "$loader" | tr '[:lower:]' '[:upper:]')=true" >> "$GITHUB_ENV"
            fi
          done
          if [ -z "$targets" ]; then
            echo "::error::No fabric/ or neoforge/ subproject found -- nothing to build."
            exit 1
          fi
          echo "GRADLE_TARGETS=${targets# }" >> "$GITHUB_ENV"

      # -Pmod_version overrides gradle.properties so that on a tag build the
      # tag is the single source of truth for the version, and the jars are
      # named after it whatever the file says. (Jar names have to match what
      # the release jobs glob for; a silent mismatch there produces an empty
      # file list rather than an error.) gradle.properties still supplies the
      # default for untagged builds, and a warning is emitted if it has
      # drifted, so the drift gets noticed without failing a release.
      - name: Check version against tag
        if: ${{ github.ref_type == 'tag' && needs.gate.outputs.github == 'true' }}
        run: |
          in_file=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$in_file" != "$VERSION" ]; then
            echo "::warning::gradle.properties has mod_version=$in_file but the tag is $VERSION; building as $VERSION."
          fi

      - name: Build
        run: ./gradlew $GRADLE_TARGETS -Pmod_version="$VERSION"

      # Emitted as a job output (rather than left in $GITHUB_ENV) because env
      # vars set in one job aren't visible in another -- the release jobs need
      # VERSION and read it via needs.build.outputs.version.
      - name: Set version output
        id: version-out
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Collects only the jars that were actually built (fabric and/or
      # neoforge) into a single artifact the release jobs download, so none of
      # them need to know the loader layout or re-run Gradle.
      - name: Collect release files
        run: |
          mkdir -p "$RUNNER_TEMP/release-files"
          for loader in fabric neoforge; do
            jar="$loader/build/libs/${ARTIFACT}-${loader}-${VERSION}.jar"
            [ -f "$jar" ] && cp "$jar" "$RUNNER_TEMP/release-files/"
          done

      - name: Upload release files
        uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/*.jar
          if-no-files-found: error
          retention-days: 14

      # Exposed as a job output so the per-loader release jobs can fan out
      # with a matrix over only the loaders that were actually built.
      - name: Set loaders output
        id: loaders-out
        run: |
          loaders="[]"
          for loader in fabric neoforge; do
            jar="$loader/build/libs/${ARTIFACT}-${loader}-${VERSION}.jar"
            [ -f "$jar" ] && loaders=$(echo "$loaders" | jq -c ". + [\"$loader\"]")
          done
          echo "loaders=$loaders" >> "$GITHUB_OUTPUT"

  # Runs for a version tag (26.0.3 or 26.0.3-pre1) and for a manual dispatch,
  # so a test build still leaves the jars somewhere downloadable -- but not for
  # a non-version tag, which builds and stops.
  #
  # Marked as a prerelease whenever gate said so -- a "-suffix" tag, or a
  # dispatch from a ref that is not a version tag -- so a test build can't be
  # mistaken for a real one. A bare X.Y.Z and a "+build" patch are both real
  # releases and are not flagged.
  release-github:
    needs: [gate, build]
    if: ${{ needs.gate.outputs.github == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      MOD_NAME: ${{ needs.build.outputs.mod_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release files
        uses: actions/download-artifact@v6
        with:
          name: release-files
          path: release-files

      # envsubst is restricted to ${VERSION} so any other $... in the prose
      # (or a stray backtick-free shell-looking string) is left alone.
      - name: Render release body
        run: envsubst '${VERSION}' < .github/release/RELEASE.md > "$RUNNER_TEMP/release-body.md"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.MOD_NAME }} ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release-body.md
          files: release-files/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}

  # mc-publish infers loaders/game-versions/dependencies from a single jar's
  # own metadata (fabric.mod.json / neoforge.mods.toml) per call, so a
  # multi-loader jar set can't be passed to one call -- it silently drops
  # everything but one loader's metadata. Instead this fans out over a matrix
  # of the loaders build actually produced, publishing one version per loader
  # (matching the existing 26.2-fabric / 26.2-neoforge versions on Modrinth).
  #
  # Only runs for a bare version tag (26.0.3 -- not 26.0.3-pre1 or 26.0.3+foo),
  # or when a manual run explicitly ticks the Modrinth box; the step is
  # additionally skipped when MODRINTH_TOKEN is unset, so a fork still builds
  # and makes a GitHub release. (The token check has to be at step level:
  # `secrets` is not available to a job-level `if:`.)
  #
  # The project id arrives as an input because a called workflow cannot see the
  # caller's `vars`; the token arrives via `secrets: inherit`.
  release-modrinth:
    needs: [gate, build]
    if: ${{ needs.gate.outputs.modrinth == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: ${{ fromJson(needs.build.outputs.loaders) }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      MOD_NAME: ${{ needs.build.outputs.mod_name }}
      ARTIFACT: ${{ needs.build.outputs.artifact }}
      VERSION_TYPE: ${{ needs.gate.outputs.version_type }}
      GAME_VERSIONS: ${{ needs.build.outputs.game_versions }}
      MODRINTH_ID: ${{ inputs.modrinth_id || secrets.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release files
        uses: actions/download-artifact@v6
        with:
          name: release-files
          path: release-files

      # Same expansion as release-curseforge; see the comment there for why
      # the list is explicit rather than inferred, and why it is stored
      # comma-separated but passed newline-separated.
      - name: Expand game versions
        run: |
          if [ -z "$GAME_VERSIONS" ]; then
            echo "::error::game_versions is not set in gradle.properties. The jar's own metadata declares an open-ended range (e.g. minecraft \">=26.3 <27\"), which mc-publish would expand against its version list -- so this build could claim support for Minecraft versions released after it was built. Set e.g. game_versions=26.3"
            exit 1
          fi
          {
            echo "GAME_VERSIONS_LIST<<EOF"
            printf '%s' "$GAME_VERSIONS" | tr ',' '\n'
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Render changelog
        run: envsubst '${VERSION}' < .github/release/CHANGELOG.md > "$RUNNER_TEMP/changelog.md"

      - name: Check Modrinth config
        if: ${{ env.MODRINTH_TOKEN != '' && env.MODRINTH_ID == '' }}
        run: |
          echo "::error::MODRINTH_TOKEN is set but no Modrinth project id was found -- nothing would be published. Set vars.MODRINTH_ID (or secrets.MODRINTH_ID) on the calling repo."
          exit 1

      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: release-files/${{ env.ARTIFACT }}-${{ matrix.loader }}-${{ env.VERSION }}.jar
          name: ${{ env.MOD_NAME }} ${{ env.VERSION }} (${{ matrix.loader }})
          version: ${{ env.VERSION }}-${{ matrix.loader }}
          version-type: ${{ env.VERSION_TYPE }}
          game-versions: ${{ env.GAME_VERSIONS_LIST }}
          changelog-file: ${{ runner.temp }}/changelog.md

  # game_versions is required, and is the one release value that cannot be
  # derived. Left unset, mc-publish falls back to the `minecraft` dependency
  # in the jar's own metadata -- but those manifests declare an open-ended
  # range (`>=26.3 <27`), which it expands against its own version list under
  # the default `releases | min-major | min-minor` filter. Two problems: the
  # upper bound is open, so once 26.4 ships the SAME jar starts being
  # published as 26.4-compatible without a rebuild; and the expansion depends
  # on mc-publish's list rather than ours, so it can drift between runs.
  # Hence the explicit list, and the hard failure when it is missing.
  #
  # It also cannot be computed from the min/current pair: a mod supporting
  # 26.1.2, 26.2 and 26.3 has no way to derive the middle entry without a
  # table of every MC release in between.
  #
  # CurseForge is the stricter of the two -- it rejects any version string it
  # doesn't already know, where Modrinth is more forgiving -- but the list is
  # passed to BOTH, so the two sites cannot disagree about the same jar.
  #
  # Fans out over the built loaders for the same reason release-modrinth
  # does: mc-publish reads loader/game-version metadata from a single jar per
  # call, so a multi-loader files list silently loses everything but one
  # loader's data.
  #
  # Gated like release-modrinth: a bare version tag, or an explicitly ticked
  # manual run.
  release-curseforge:
    needs: [gate, build]
    if: ${{ needs.gate.outputs.curseforge == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: ${{ fromJson(needs.build.outputs.loaders) }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      MOD_NAME: ${{ needs.build.outputs.mod_name }}
      ARTIFACT: ${{ needs.build.outputs.artifact }}
      VERSION_TYPE: ${{ needs.gate.outputs.version_type }}
      GAME_VERSIONS: ${{ needs.build.outputs.game_versions }}
      CURSEFORGE_ID: ${{ inputs.curseforge_id || secrets.CURSEFORGE_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release files
        uses: actions/download-artifact@v6
        with:
          name: release-files
          path: release-files

      # game_versions is stored as a flat comma-separated list in
      # gradle.properties (one readable line, no YAML block), but mc-publish's
      # game-versions input wants a newline-separated block -- a comma-joined
      # string is treated as one unrecognised version, and CurseForge then has
      # nothing to upload against. Each entry may itself be a range that
      # mc-publish understands (`[26.1.2,26.3]`, `>=26.3 <27`); a plain list of
      # exact versions is preferred, since a range re-introduces the drift
      # described above.
      - name: Expand game versions
        run: |
          if [ -z "$GAME_VERSIONS" ]; then
            echo "::error::game_versions is not set in gradle.properties. The jar's own metadata declares an open-ended range (e.g. minecraft \">=26.3 <27\"), which mc-publish would expand against its version list -- so this build could claim support for Minecraft versions released after it was built. Set e.g. game_versions=26.3"
            exit 1
          fi
          {
            echo "GAME_VERSIONS_LIST<<EOF"
            printf '%s' "$GAME_VERSIONS" | tr ',' '\n'
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Render changelog
        run: envsubst '${VERSION}' < .github/release/CHANGELOG.md > "$RUNNER_TEMP/changelog.md"

      - name: Check CurseForge config
        if: ${{ env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_ID == '' }}
        run: |
          echo "::error::CURSEFORGE_TOKEN is set but no CurseForge project id was found -- nothing would be published. Set vars.CURSEFORGE_ID (or secrets.CURSEFORGE_ID) on the calling repo."
          exit 1

      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' }}
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: release-files/${{ env.ARTIFACT }}-${{ matrix.loader }}-${{ env.VERSION }}.jar
